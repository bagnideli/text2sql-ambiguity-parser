<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title description">
  <title id="title">Вход и выход парсера неоднозначностей</title>
  <desc id="description">Запрос пользователя и схема базы данных с доступными знаниями поступают в парсер. Парсер возвращает JSON-массив проблем с фрагментами и типами.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 300 58 C 346 58 344 96 383 96"/>
    <path d="M 300 162 C 346 162 344 124 383 124"/>
    <path d="M 555 110 H 648"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="24" width="280" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="20" y="128" width="280" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="385" y="78" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="650" y="78" width="290" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="160" y="65">Запрос пользователя</text>
    <text x="160" y="157">Схема БД и доступные</text>
    <text x="160" y="180">знания</text>
    <text x="470" y="117" font-weight="600">Парсер</text>
    <text x="795" y="105">JSON-массив проблем</text>
    <text x="795" y="128" font-size="16">с фрагментами и типами</text>
  </g>
</svg>
