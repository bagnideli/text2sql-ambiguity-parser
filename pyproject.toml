[project]
name = "text2sql-ambiguity-parser"
version = "0.1.0"
description = "Context-aware ambiguity detection in Text-to-SQL queries, focused on Russian."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Вячеслав Масликов" }]
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ambiguity_parser"

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
